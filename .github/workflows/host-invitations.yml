name: Everyone’s Awake host invitations
on:
  workflow_dispatch:
  schedule:
    # Both UTC offsets cover Toronto daylight saving time; the script selects 6pm.
    - cron: '0 22,23 * * *'
permissions:
  contents: read
concurrency:
  group: everyone-awake-invitations
  cancel-in-progress: false
jobs:
  invite:
    if: github.event_name == 'workflow_dispatch' || vars.HOST_INVITATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send one invitation
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/invite_host.py
