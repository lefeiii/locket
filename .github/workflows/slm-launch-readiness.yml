name: Someone Like Me launch readiness
on:
  push:
    branches: [main]
    paths: ['.github/workflows/slm-launch-readiness.yml']
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check installation and safety gates without reading participant data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: python
        run: |
          import os, json, urllib.request, urllib.error, datetime
          base = os.environ['SUPABASE_URL'].rstrip('/')
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          def read(path):
              req = urllib.request.Request(base + '/rest/v1/' + path, headers={'apikey': key, 'Authorization': 'Bearer ' + key})
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  return error.code, None
          status, rows = read('slm_contact_config?select=enabled,age_assurance_ready,age_process_reference,coverage_confirmed_at,coverage_until&limit=1')
          installed = status == 200 and bool(rows)
          result = {'connections_migration_installed': installed}
          if installed:
              row = rows[0]
              until = row.get('coverage_until')
              result.update(contact_switch_enabled=row['enabled'],
                  external_age_process_configured=bool(row['age_assurance_ready'] and row.get('age_process_reference')),
                  coverage_current=bool(until and datetime.datetime.fromisoformat(until.replace('Z','+00:00')) > datetime.datetime.now(datetime.timezone.utc)))
          print(json.dumps(result))
