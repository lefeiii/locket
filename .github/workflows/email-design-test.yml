name: One-time Locket email design test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/email-design-test.yml'
permissions:
  contents: read
concurrency:
  group: locket-email-design-test
  cancel-in-progress: false
jobs:
  send-test:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send the requested design test
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os, sys, smtplib, ssl, uuid
          sys.path.insert(0, 'scripts')
          from send_notification_emails import message_for, SENDER, SITE
          token = 'a' * 64
          message = message_for({
              'id': str(uuid.uuid4()), 'email': 'lefeicheninca@gmail.com',
              'kind': 'story_updates', 'event_count': 1,
              'story_id': 'design-test', 'token': token,
          })
          message.replace_header('Subject', '[Test] A little note from Locket')
          for subtype in ('plain', 'html'):
              part = message.get_body(preferencelist=(subtype,))
              body = part.get_content().replace(SITE + '/story/design-test', SITE + '/')
              body = body.replace(SITE + '/email/unsubscribe#token=' + token, SITE + '/settings')
              body = body.replace('You chose these emails on Locket.', 'This is your requested design test.')
              body = body.replace('You chose these notifications in Locket.', 'This is your requested design test.')
              part.set_content(body, subtype=subtype)
          with smtplib.SMTP_SSL('smtp.gmail.com', 465, context=ssl.create_default_context(), timeout=30) as smtp:
              smtp.login(SENDER, os.environ['GMAIL_APP_PASSWORD'].replace(' ', ''))
              refused = smtp.send_message(message)
              if refused:
                  raise RuntimeError('SMTP did not accept the test recipient.')
          print('Gmail accepted the single design test. Check the recipient inbox and spam folder.')
          PY
